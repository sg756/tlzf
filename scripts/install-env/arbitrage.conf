# =============================================================================
# FlowOrderArbitrage · 服务器配置（只改本文件）
# 位置：scripts/install-env/
# 被谁读取：install.sh、apply-dist.sh、start.sh、restart.sh、stop.sh
# =============================================================================

# -----------------------------------------------------------------------------
# APP_ROOT
# 作用：install 时创建的目录；推荐 /opt/FlowOrderArbitrage。
# apply-dist / bootstrap：若本脚本在「已上传的代码」里（上两级有 package.json + dist/），
# 自动用那个目录，不必和这里逐字相同（Linux 区分大小写）。
# 脚本单独放、旁边没有代码时，仍用下面这一项。
# -----------------------------------------------------------------------------
APP_ROOT=/opt/FlowOrderArbitrage

# -----------------------------------------------------------------------------
# SERVICE_NAME
# 作用：systemd 单元名（apply-dist 生成 /etc/systemd/system/<名>.service）。
# -----------------------------------------------------------------------------
SERVICE_NAME=floworder-arbitrage

# -----------------------------------------------------------------------------
# LOG_DIR
# 作用：stdout/stderr 落盘目录（apply-dist 写入按天日志）。
# 空 = ${APP_ROOT}/logs
# 当天：tail -f ${LOG_DIR}/arb-$(date +%Y-%m-%d).log
# -----------------------------------------------------------------------------
LOG_DIR=

# -----------------------------------------------------------------------------
# RUN_USER
# 作用：运行 Node 的系统用户（install 创建）。
# -----------------------------------------------------------------------------
RUN_USER=floworder-arb

# -----------------------------------------------------------------------------
# NODE_BIN
# 作用：系统级 node 绝对路径。空 = 自动找 /usr/local/bin/node、/usr/bin/node。
# sudo 时经常看不到登录用户的 nvm（~/.nvm），那种 22 也不能给 systemd 用。
# 已有系统级 18+ 就不要再装 20；可写死例如 /usr/local/bin/node
# -----------------------------------------------------------------------------
NODE_BIN=

# -----------------------------------------------------------------------------
# UI_PORT
# 作用：查看页端口（信号显示 / POST 日志）。
# install 时若 firewalld 在跑会放行该端口。
# 程序实际监听端口在查看页「运行配置」里改，存 SQLite（data/app.db）。
# 首次启动默认 3780，请与这里保持一致。
# 0 = 不放行防火墙。
# -----------------------------------------------------------------------------
UI_PORT=3780

# -----------------------------------------------------------------------------
# COMPILE_ON_SERVER
# 作用：apply-dist / bootstrap 是否在 Linux 上编译。
#   true  = 服务器 npm install + npm run build（上传了 src/ 时用）
#   false = 用本机 Windows 编好的 dist-release（build.ps1）
# 无论 true/false，都会在 Linux 上自动 npm 下载依赖（不要传 Windows 的 node_modules）。
# 若 dist/main.js 不存在但有 src/，即使 false 也会自动编译一次。
# -----------------------------------------------------------------------------
COMPILE_ON_SERVER=false

# -----------------------------------------------------------------------------
# GITHUB_REPO / GITHUB_RELEASE_TAG
# 作用：空目录一键安装时，从 GitHub Release 拉 dist-release.zip 覆盖到 APP_ROOT。
# 发布包由 .github/workflows/release-dist.yml 推到 tag=dist。
# 私有仓库可先 export GH_TOKEN=... 再跑脚本。
# -----------------------------------------------------------------------------
GITHUB_REPO=sg756/tlzf
GITHUB_RELEASE_TAG=dist
